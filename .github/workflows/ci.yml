name: CI

on:
  push:
    branches:
      - add-zoo-packages
  pull_request:

permissions:
  actions: read
  contents: read

# Token value lives in GitHub Secrets — only the reference is committed here.
# Create at https://cloud.nx.app → Workspace Settings → Access Tokens
# Use read-only for PRs; use read-write on protected branches (e.g. main) via Environments.
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Nx Agents: uncomment after enabling in Nx Cloud (https://cloud.nx.app).
      # Run as early as possible, before dependencies are installed.
      # Learn more: https://nx.dev/docs/features/ci-features/distribute-task-execution
      # - run: pnpm nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - run: pnpm nx affected -t lint test build

      - run: pnpm nx-cloud fix-ci
        if: always()
