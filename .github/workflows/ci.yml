name: CI

on:
  push:
    branches:
      - add-zoo-packages
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  add-zoo-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t lint test build

      - run: pnpm nx-cloud fix-ci
        if: always()