name: CI

on:
  push:
    branches:
      - add-zoo-packages
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  add-zoo-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npx nx run-many -t lint test build

      - run: npx nx-cloud fix-ci
        if: always()